      status.textContent = 'このブラウザでは復号できません。最新版のEdge / Chrome / Firefox / Safariで、HTTPSまたはlocalhostから開いてください。';
      return;
    }
    const run = ++generation;
    let passwordBytes = new TextEncoder().encode(field.value);
    field.value = '';
    submit.disabled = true;
    form.setAttribute('aria-busy', 'true');
    status.textContent = 'パスワードを確認しています…';
    try {
      const material = await crypto.subtle.importKey('raw', passwordBytes, 'PBKDF2', false, ['deriveKey']);
      passwordBytes.fill(0);
      passwordBytes = null;
      const key = await crypto.subtle.deriveKey(
        { name: 'PBKDF2', hash: 'SHA-256', salt: bytes(protectedDocument.salt), iterations: protectedDocument.iterations },
        material, { name: 'AES-GCM', length: 256 }, false, ['decrypt']
      );
      const compressed = await crypto.subtle.decrypt(
        { name: 'AES-GCM', iv: bytes(protectedDocument.iv) }, key, bytes(protectedDocument.ciphertext)
      );
      const stream = new Blob([compressed]).stream().pipeThrough(new DecompressionStream('gzip'));
      const documentHtml = await new Response(stream).text();
      new Uint8Array(compressed).fill(0);
      if (run !== generation) return;
      frame.srcdoc = documentHtml;
      frame.hidden = false;
      gate.hidden = true;
      lock.hidden = false;
      status.textContent = '';
      window.scrollTo(0, 0);
      lock.focus({ preventScroll: true });
    } catch (error) {
      if (run !== generation) return;
      status.textContent = error.name === 'OperationError'
        ? 'パスワードが違います。もう一度入力してください。'
        : '資料を開けませんでした。ブラウザを更新して再度お試しください。';
      field.focus();
    } finally {
      if (passwordBytes) passwordBytes.fill(0);
      if (run === generation) {
        submit.disabled = false;
        form.removeAttribute('aria-busy');
      }
    }
  });
})();
  </script>
